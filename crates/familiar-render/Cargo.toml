[package]
name = "render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
core = { workspace = true }
ui = { workspace = true }

[dependencies.egui]
version = "0.28"
optional = true

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]
optional = true

[features]
default = []
# egui binder: renders a `ui::View` tree via egui. Platform-agnostic — the
# platform crate provides the window/surface; this provides the widget mapping.
egui = ["dep:egui", "dep:image"]

[package]
name = "audio-aura-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# ── Stage1 ASR examples (former aura-asr) + Stage1→Stage2 bench ──
[[example]]
name = "transcribe"

[[example]]
name = "batch_transcribe"

[[example]]
name = "qwen3_asr"

[[example]]
name = "scout_debug"

[[example]]
name = "streaming_asr"

[[example]]
name = "streaming_asr_hot"

# Thin Stage1→Stage2 bench built on the Pipeline composer.
# Stage2 LLM 走 dp-router(OpenAI 兼容 `/v1/chat/completions`);examples 默认指向
# http://127.0.0.1:8080,可通过 DP_ROUTER_ENDPOINT / DP_ROUTER_MODEL 环境变量覆盖。
[[example]]
name = "stage12_live"

[[example]]
name = "calibrate_bench"

[dependencies]
dp-models = { workspace = true, features = ["speech"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "../shared", features = ["log"] }
anyhow = "1"
tracing = { workspace = true }
chrono = "0.4"

[build-dependencies]
shared = { path = "../shared" }

[package.metadata.shared]
MODELS = { dev = "../../assets/models", prod = "~/.desk-pilot/models" }
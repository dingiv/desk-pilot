[package]
name = "audio-aura-asr"
version = "0.1.0"
edition = "2021"
description = "Stage1 — capture + VAD + ASR (two-pass) + the Stage1Executor abstraction. A true leaf crate (no aura-dcl dep)."

[dependencies]
tracing = { workspace = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
shared = { path = "../shared" }
# ONNX 语音栈(VAD/流式/batch ASR)已迁至 dp-models(feature `speech`)——
# 本 crate 不再直接依赖 sherpa-onnx,只转发 feature。
dp-models = { workspace = true, features = ["speech"] }

[build-dependencies]
shared = { path = "../shared" }

# Namespace: model files. dev = relative to this crate's dir → ../../assets/models.
# prod = user-installed models under ~/.audio-aura/models.
[package.metadata.shared]
MODELS = { dev = "../../assets/models", prod = "~/.desk-pilot/models" }

[[example]]
name = "transcribe"
required-features = ["onnx"]

[[example]]
name = "batch_transcribe"
required-features = ["onnx"]

[[example]]
name = "qwen3_asr"
required-features = ["onnx"]

[[example]]
name = "scout_debug"

[[example]]
name = "streaming_asr"
required-features = ["onnx"]

[[example]]
name = "streaming_asr_hot"
required-features = ["onnx"]

[features]
default = []
# ONNX 语音栈在 dp-models(sherpa-onnx 封装已迁入);此 feature 转发开启 + 门控 Stage1Executor impl。
onnx = ["dp-models/speech"]
# Enable everything (currently just onnx). Lets upstream crates pull Stage1 via a stable `all`
# handle regardless of how many onnx-gated features grow here.
all = ["onnx"]

[dev-dependencies]
audio-aura-core = { path = "../aura-core" }

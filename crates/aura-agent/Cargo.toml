[package]
name = "audio-aura-agent"
version = "0.1.0"
edition = "2021"
description = "Stage3 capability layer + the daemon↔client wire contract & async HTTP/SSE client SDK. Light (no mistralrs/asr) so upper layers depend on this without the GPU stack."

# Smoke test for AuraClient — connects to a running aura-daemon and prints snapshots.
# Light crate → no required-features (unlike aura-core's asr-gated examples).
[[example]]
name = "client_demo"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }
# ── client SDK (talks to aura-daemon over HTTP + SSE snapshot-sync) ──
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
reqwest = { workspace = true, features = ["stream"] }
async-stream = "0.3"
futures = "0.3"

[dev-dependencies]
chrono = "0.4"
futures = "0.3"

[features]
default = []

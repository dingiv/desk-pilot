[package]
name = "audio-aura-native"
version = "0.1.0"
edition = "2021"
description = "napi shim over audio-aura-router — keeps the TS dev path (VOICE_LOCAL_ROUTER) working"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
audio-aura-core = { path = "../aura-core" }
napi = "2"
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[package]
name = "dp-models"
version.workspace = true
edition.workspace = true
description = "desk-pilot 模型 Provider 抽象层 + 内部 SDK:统一 local(lib 嵌入)/remote(OpenAI 兼容 HTTP) 推理后端,跨 aura / visual-rover 子系统。远程目标为 apps/dp-router 或任意 OpenAI 兼容服务(vLLM / llama.cpp remote 等)。"

[dependencies]
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
base64 = { workspace = true }
tracing = { workspace = true }
# ONNX 实时语音(VAD/流式 ASR/batch ASR fallback)via sherpa-onnx —— 重依赖,默认不开启;
# audio-aura 通过其 onnx feature 转发开启。目的:把重依赖从业务进程隔离到 dp-models。
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"], optional = true }

[features]
default = []
# 实时语音栈:VAD (Silero) + 流式 ASR (Zipformer) + batch ASR (SenseVoice/Qwen3-ASR/Whisper)。
# 本地 Rust 进程内 host(不走 HTTP),由 audio-aura 的 asr feature 转发开启。
speech = ["dep:sherpa-onnx"]

[[example]]
name = "remote"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
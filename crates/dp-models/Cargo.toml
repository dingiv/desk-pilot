[package]
name = "dp-models"
version.workspace = true
edition.workspace = true
description = "desk-pilot 本地模型 Provider 抽象层: 统一 local(lib 嵌入)/remote(OpenAI 兼容 HTTP) 推理后端, 跨 aura / visual-rover 子系统。"

[dependencies]
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
base64 = { workspace = true }
tracing = { workspace = true }
# ONNX 实时语音(VAD/流式 ASR/batch ASR fallback)via sherpa-onnx —— 重依赖,默认不开启;
# audio-aura 通过其 onnx feature 转发开启。目的:把重依赖从业务进程隔离到 dp-models。
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"], optional = true }
# 本地 Stage2 LLM (mistral.rs Qwen GGUF) —— 重依赖,默认不开启;aura-core 的 cuda/mistral
# feature 转发开启。目的:把 GPU/LLM 重依赖隔离到 dp-models(今后 stage2 走远程)。
mistralrs = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
# `Calibrator::load_default` 的 MODELS 命名空间解析(见 build.rs + [package.metadata.shared])。
shared = { path = "../shared", features = ["log"], optional = true }

[build-dependencies]
shared = { path = "../shared" }

[features]
default = []
# 实时语音栈:VAD (Silero) + 流式 ASR (Zipformer) + batch ASR (SenseVoice/Qwen3-ASR/Whisper)。
speech = ["dep:sherpa-onnx"]
# 本地 Stage2 LLM (mistral.rs)。aura-core 通过其 mistral/cuda feature 转发开启。
mistral = ["dep:mistralrs", "dep:tokio", "dep:shared"]
# 本地 LLM 走 CUDA(mistralrs/cuda;隐式开启 mistral)。
cuda = ["mistral", "mistralrs/cuda"]

[package.metadata.shared]
MODELS = { dev = "../../assets/models", prod = "~/.desk-pilot/models" }

[[example]]
name = "remote"

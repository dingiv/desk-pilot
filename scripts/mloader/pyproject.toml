[project]
name = "mloader"
version = "0.1.0"
description = "desk-pilot model loader: 模型下载 / 引擎启停 / 环境探测 (跨平台 subprocess, 不 shell)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "huggingface_hub>=0.30",
    "numpy>=2.2.6",
    "pynvml>=12",
    "qwen-asr>=0.0.6",
]

# mock/asr server 的 FastAPI (轻量, 可 lock):
[project.optional-dependencies]
server = ["fastapi", "uvicorn"]
vllm = ["vllm"]
sglang = ["sglang"]
transformers = ["transformers"]

[project.scripts]
mloader-serve    = "mloader.serve:main"
mloader-download = "mloader.download:main"
mloader-detect   = "mloader.detect_env:main"

[tool.setuptools]
packages = ["mloader"]

[tool.setuptools.package-dir]
mloader = "."

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

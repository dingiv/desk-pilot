[project]
name = "mloader"
version = "0.1.0"
description = "desk-pilot model loader: 模型下载 / 引擎启停 / 环境探测 (跨平台 subprocess, 不 shell)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "huggingface_hub>=0.30",
    "numpy>=2.2.6",
    "pynvml>=12",
]

# 重引擎 + mock 服务都可选 (按需装):
#   uv pip install -e ".[engine]"   # vllm + sglang + transformers (serve.py vllm/sglang)
#   uv pip install -e ".[server]"   # fastapi + uvicorn (serve.py mock)
#   uv pip install -e ".[engine,server]"
[project.optional-dependencies]
engine = ["vllm", "sglang>=0.5.9", "transformers>=4.57.1"]
server = ["fastapi", "uvicorn"]

[project.scripts]
mloader-serve    = "mloader.serve:main"
mloader-download = "mloader.download:main"
mloader-detect   = "mloader.detect_env:main"

[tool.setuptools]
packages = ["mloader"]

[tool.setuptools.package-dir]
mloader = "."

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[package]
name = "swift-ime"
version = "0.1.0"
edition = "2021"
description = "swift-ime — DeskPilot input method engine (fcitx5 addon .so + ibus DBus engine)"
default-run = "swift-ime"

[lib]
name = "swift_ime"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "swift-ime"
path = "src/main.rs"

[dependencies]
ime-core = { workspace = true, features = ["http"] }
inputx-fsa = "1"
shared = { path = "../../crates/shared", features = ["log"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
ratatui = "0.28"
crossterm = "0.28.1"
# ── aura voice integration ── the audio-aura-agent SDK owns the whole connection (its own
# background driver + tokio runtime); the bridge only drains poll_events → AsrBuffer for `#asr`.
audio-aura-agent = { path = "../../crates/aura-agent" }
futures = "0.3"
# bridge.rs 在引擎 I/O 线程的 runtime 上跑定时 drain,需要直接拿 sleep / JoinHandle。
# 通过 ime-core 的 io_thread.handle() 拿到 runtime handle,tokio 子集够用。
tokio = { version = "1", features = ["time", "rt"] }

[build-dependencies]
shared = { path = "../../crates/shared" }

# Dict + Config resolution: dev = relative to CARGO_MANIFEST_DIR; prod = installed paths.
[package.metadata.shared]
DICT = { dev = "assets/dict", prod = "/usr/share/swift-ime/dict" }
CONF = { dev = ".", prod = "~/.desk-pilot" }
DATA = { dev = "data", prod = "~/.desk-pilot"}
SNIP = { dev = "assets/snippets", prod = "~/.desk-pilot/snippets"}
[package]
name = "swift-ime"
version = "0.1.0"
edition = "2021"
description = "swift-ime — DeskPilot input method engine (fcitx5 addon .so + ibus DBus engine)"

[lib]
name = "swift_ime"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "swift-ime"
path = "src/main.rs"

[dependencies]
ime-core = { workspace = true }
shared = { path = "../../crates/shared", features = ["log"] }
tracing = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
shared = { path = "../../crates/shared" }

# Dict file resolution: dev = relative to CARGO_MANIFEST_DIR; prod = installed system path.
[package.metadata.shared]
DICT = { dev = "assets/dict", prod = "/usr/share/swift-ime/dict" }

[package]
name = "swift-ime"
version = "0.1.0"
edition = "2021"
description = "swift-ime — DeskPilot input method engine (fcitx5 addon .so + ibus DBus engine)"
default-run = "swift-ime"

[lib]
name = "swift_ime"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "swift-ime"
path = "src/main.rs"

[dependencies]
ime-core = { workspace = true, features = ["http"] }
inputx-fsa = "1"
shared = { path = "../../crates/shared", features = ["log"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
ratatui = "0.28"
crossterm = "0.28.1"
# ── aura voice integration ── voice 不在本 crate:连接、SSE 折叠、定时器全部
# 住在 ime-core 的 io_thread(它自己依赖 audio-aura-agent SDK + tokio)。
# swift-ime 只经 ImeEngine 读 SharedTranscript / magic_tick,无需直接依赖。

[build-dependencies]
shared = { path = "../../crates/shared" }

# Dict + Config resolution: dev = relative to CARGO_MANIFEST_DIR; prod = installed paths.
[package.metadata.shared]
DICT = { dev = "assets/dict", prod = "/usr/share/swift-ime/dict" }
CONF = { dev = ".", prod = "~/.desk-pilot" }
DATA = { dev = "data", prod = "~/.desk-pilot"}
SNIP = { dev = "assets/snippets", prod = "~/.desk-pilot/snippets"}
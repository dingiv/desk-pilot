# swift-ime configuration
# Dev: <repo>/apps/swift-ime/swift-ime.yaml
# Prod: ~/.desk-pilot/swift-ime.yaml

# ── Dictionaries ────────────────────────────────────────────────────────
dicts:
  base: true          # embedded base dictionary (compiled into binary)
  rime_ice: true      # rime-ice large dictionary (loaded from disk at startup)

# ── Magic commands ──────────────────────────────────────────────────────
magic:
  req_base: http://127.0.0.1:14555/api   # #req backend base URL (CLI --req-base overrides)

# ── Snippets ────────────────────────────────────────────────────────────
# User-defined text expansions, merged over the engine's built-ins (a config
# trigger replaces the built-in one). Triggers are '/' or '#'-prefixed and
# matched longest-prefix. Expansions support variables:
#   $DATE       today's date (YYYY-MM-DD)
#   $CLIPBOARD  the current clipboard text (fcitx5 clipboard)
#   $CURSOR     caret lands here after commit
snippets:
  - trigger: "/sig"
    expand: "Best regards,\nAlice\n$DATE"
  - trigger: "/clip"
    expand: "Clip: $CLIPBOARD"

# ── Input ───────────────────────────────────────────────────────────────
input:
  fuzzy: true         # fuzzy pinyin (z/zh, c/ch, s/sh, n/l, etc.)
  page_size: 7        # candidates per page

# ── Weights (scoring parameters for each prediction layer) ──────────────
# Final score = raw_score × (family_priority / 100), then ranked.
# All values are intentionally conservative — top candidates land in
# 0.70–0.85 range, leaving headroom for recency/context boosts.
weights:
  # English priority in the global ranking (0-100). The other families'
  # priorities (pinyin/magic/snippet) are fixed in the engine's scorer.
  family_priority:
    english: 70

  # Pinyin family internal scores (0.0-1.0)
  pinyin:
    phrase_book: 0.88       # user-learned phrases
    large_dict: 0.85        # rime-ice exact match
    viterbi_base: 0.25      # Viterbi min score
    viterbi_scale: 0.55     # Viterbi score range (max = base + scale = 0.80)
    jianpin: 0.50           # initials-only match discount (nh→你好)
    single_syl_decay: 0.5   # score decay per position in single-syllable lookup
    context_boost: 0.12     # bonus for bigram match with previous word
    stopword_penalty: 0.5   # multiplier for all-stopword compositions
    confirm_bonus: 0.05     # bonus when word appears in both dict and viterbi
    short_word_bonus: 0.01  # bonus for 2-char words
    large_dict_take: 96     # max LargeDict candidates per query
    viterbi_take: 48        # max Viterbi compositions per query
    jianpin_take: 8         # max jianpin candidates per query

  # English family internal scores
  english:
    exact: 0.88             # exact word match
    prefix_ratio: 0.6       # max score for prefix match (scaled by match ratio)

# aura-daemon 配置 (YAML — 支持 # 注释, 按模块分层)
# 优先级: CLI > 本文件 > 内置默认。aura.yaml 优先于 aura.json (向下兼容)。
# 注意: 未知键直接报错回退内置默认 (deny_unknown_fields) —— 键名拼错不会静默失效。

# ── daemon 服务 ───────────────────────────────────────────────────────────────
scout_addr: "127.0.0.1:7878"   # omni-scout /audio 地址 (音频源; local/remote ASR 都吃它)
scout_chunk_ms: 64            # 请求 scout 按 ~N-ms 聚合推流 (HTTP chunk; 不能快过 scout
                              #   node.quantum, 默认 quantum=1024@16kHz=64ms; 实测 pipewire 实际
                              #   ~42.7ms/块)。None=不传, scout 按自身 quantum 速率推。纯网络层
                              #   优化——消费侧照样重切 32ms 窗喂 VAD, 只省上游网络读取/唤醒。
bind_addr: "127.0.0.1"          # daemon socket 监听地址
port: 9091                      # daemon socket 端口
stage3: true                    # 运行进程内 Stage3 规则触发器
# web_dist: "../dist"           # 内置 SPA 静态目录 (默认: workspace dist/)

# ── 日志 ──────────────────────────────────────────────────────────────────────
# 等级: trace | debug | info | warn | error; 也支持 EnvFilter 指令语法 (如
# "audio_aura_core=debug,info")。RUST_LOG 环境变量优先于此处 (逃生舱)。
# 注意: 高频识别日志 (流式 partial ~0.5s/条、纠偏碎片 ~1s/条) 只在 debug 可见;
# info 只出 final (每定稿一句一条, 含 batch/streaming/calibrated 三层文本)。
log_level: "debug"               # 调试语音管线时改 "debug"

# ── Stage1 语音前端 (asr) ─────────────────────────────────────────────────────
# stream = 流式 ASR (恒本地, 实时 partial 要低延迟); backend 选批式 ASR 部署。
asr:
  stream:                       # 流式引擎 (未知值启动报错, 不静默回退)
    model: zipformer            # zipformer (2023 双语) | x-asr (2026, 100万小时 zh-en, assets/models/x-asr)
  backend: remote               # local | remote | disable
  local:                        # backend=local 时生效
    model: sensevoice           # 本地批式引擎: sensevoice (唯一本地; whisper/qwen3-asr 本地模型
                                #   已删, qwen3-asr 走 asr.backend: remote)
    language: auto              # 批式语言 (sensevoice/whisper)
    hardware: cpu               # onnxruntime 装置: cpu | cuda (cuda 需 GPU sherpa lib + cuDNN 9.25)
    threads: 8                  # 批式 intra-op 线程 (8 核甜点)
    # model_dir: "/path/to/models"  # 模型根目录覆盖 (默认 MODELS 命名空间; VAD/流式/批式全走它)
  remote:                       # backend=remote 时生效
    endpoint: "http://127.0.0.1:8000"  # OpenAI 兼容服务地址 (qwen-asr-serve 等)
    # api_key: ...              # 未来: HttpAsr 尚未支持鉴权, 落键无行为故先不开
  # backend=disable: 纯流式模式 —— 不加载批式模型, batch_text 恒 None (回退流式文本),
  # 省掉段级/窗口级 batch 调用 (远程 ~3.5s/次)。
  # ── VAD / 分段 (Silero; 全部可选, 不写用内置默认) ──
  #   min_silence 和 merge_gap 解耦, 分别切出段与窗口两级边界:
  #     · min_silence = VAD 静音达此秒数 → EOS 切段 (切段灵敏度) —— 保持小 (1s),
  #                     停顿一过立即段级 batch, 响应快
  #     · merge_gap   = 窗口定稿上界: 段间静音短于此值 → 并入同一 VadWindow
  #                    (窗口级 batch 重跑出权威文本); ≥ 此值 → 窗口定稿出 WindowEdge。
  #                    "什么算一句话"的旋钮, 0 = 每段独立成窗。
  vad:
    threshold: 0.2        # Silero 灵敏度 (高=迟钝少误触; 低=灵敏可听轻声; VAD 门控流式后这是听力主旋钮)
    min_silence: 1.0      # 静音达此秒数 → EOS 切段
    min_speech: 0.3       # 短于此秒数的段直接丢弃
    max_speech: 28.0      # 超长强制切 (backstop, 秒)
    merge_gap: 3.5        # ★窗口定稿上界 (秒)
    edge_margin: 0.3      # 段边界扩展 (秒), 补 Silero 切掉的软起音/尾音

# ── Stage2 LLM (llm) ──────────────────────────────────────────────────────────
llm:
  backend: remote                # local (mistral.rs) | remote (vLLM/sglang) | disable
  model: "qwen2.5-3b-instruct-q4_k_m.gguf"  # local: GGUF 文件名; remote: 服务端模型名
  # model_dir: "/path/to/models"            # local 时模型根目录覆盖 (默认 MODELS 命名空间)
  # endpoint: "http://127.0.0.1:3000"       # backend=remote 时服务地址
  input: batch                  # Stage2 纠偏输入源: batch (默认) | stream | both
                                #   batch  = 只用批式结果(best_text: batch 优先)
                                #   stream = 只用流式结果(热词偏置强/句首全, 但同音字多)
                                #   both   = 双通道对照(batch 权威 + 流式补句首)
  # backend=disable: 完全关闭第二阶段 —— 不加载 LLM, 校准=恒等 (calibrated 直接承载
  # 原文, 零 LLM 延迟/开销; 纯 ASR 部署或对照 Stage2 贡献用)。

# ── 种子热词 (流式 recognizer beam bias + Stage2 整流参考) ────────────────────
hotwords: ["Rust", "Bevy", "贪吃蛇"]

# ── 存储 (音频持久化: 短期记录供复盘 + 未来 Stage3) ───────────────────────────
storage:
  retention_days: 7             # 保留期(天): 超期的录音 + turn 日志被清理 (启动时 + 每 24h)
  # recordings_dir: "~/.desk-pilot/data/recordings"  # 录音根目录覆盖 (默认 DATA::recordings)

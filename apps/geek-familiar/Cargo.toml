[package]
name = "geek-familiar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
core = { workspace = true }
render = { workspace = true }
platform = { workspace = true }
ui = { workspace = true }
fs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[build-dependencies]
fs = { workspace = true }

# FileLoader namespace: dev reads this crate's dir, prod reads ~/.desk-pilot/.
# `fs.read_str("CONF::familiar.yaml")` resolves accordingly.
[package.metadata.shared]
CONF = { dev = ".", prod = "~/.desk-pilot" }

[features]
default = []
# Select the GTK4 backend (no-op stub until M1; real build needs libgtk-4-dev).
gtk = ["platform/gtk"]
# Render the pet UI with egui (offscreen wgpu → RGBA8). Use together with `gtk`;
# needs a Vulkan GPU (set VK_ICD_FILENAMES).
egui = ["gtk", "platform/egui"]

[package]
name = "geek-familiar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
iced = { version = "0.14", features = ["wgpu", "image"] }
raw-window-handle = "0.6"
# Wayland input-region FFI (click-through). "system" feature is required for
# Backend::from_foreign_display (attaching to iced's existing wl_display).
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
fs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[build-dependencies]
fs = { workspace = true }

# FileLoader namespaces (consumed by build.rs → fs::loader!()).
# CONF: runtime config — dev reads this crate's dir, prod reads ~/.desk-pilot/.
# SKIN: skin assets — dev reads this crate's assets/skins/, prod reads ~/.geek-familiar/skins/.
[package.metadata.shared]
CONF = { dev = ".", prod = "~/.desk-pilot" }
SKIN = { dev = "assets/skins", prod = "~/.geek-familiar/skins" }
